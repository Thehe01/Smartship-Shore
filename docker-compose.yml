# P2-1/P2-2/P2-3 local dependencies: Kafka (KRaft, no ZooKeeper), Mosquitto, MySQL, Redis.
# Start everything with:  docker compose up -d
# Shore connects from the host via: MQTT localhost:1883, Kafka localhost:29092,
# MySQL localhost:3306, Redis localhost:6379.

services:
  mysql:
    image: mysql:8.0
    container_name: smartship-shore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DB:-smartship_shore}
      MYSQL_USER: ${MYSQL_USER:-shore}
      MYSQL_PASSWORD: ${MYSQL_PASS:-shore123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - shore-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartship-shore-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - shore-mosquitto-data:/mosquitto/data
      - shore-mosquitto-log:/mosquitto/log

  kafka:
    image: apache/kafka:3.8.0
    container_name: smartship-shore-kafka
    restart: unless-stopped
    environment:
      NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      PROCESS_ROLES: broker,controller
      LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CONTROLLER_LISTENER_NAMES: CONTROLLER
      AUTO_CREATE_TOPICS_ENABLE: "true"
      OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      TZ: Asia/Shanghai
    ports:
      - "29092:29092"
    volumes:
      - shore-kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    container_name: smartship-shore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shore-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  shore-mysql-data:
  shore-mosquitto-data:
  shore-mosquitto-log:
  shore-kafka-data:
  shore-redis-data:
