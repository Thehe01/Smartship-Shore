# Test-only Mosquitto config for Testcontainers (anonymous LAN/dev access).
listener 1883
protocol mqtt
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Benchmark bursts (10k/50k) arrive far faster than the shore serial
# MQTT->Kafka handoff drains: with the default bounded per-client queue the
# broker silently drops queued QoS1 for the slow durable subscriber (a 10k run
# stranded at 2205/2205 received/produced with zero downstream errors).
# Unbounded queue here is test infrastructure holding the declared workload,
# not a production tuning claim.
max_queued_messages 0
