# Smartship-Shore P2-1 default configuration.
# Environment-specific values come from env vars (see docker-compose.yml / .env.example);
# nothing secret is hard-coded in Java sources or here beyond local dev defaults.
server:
  port: 8081

spring:
  application:
    name: smartship-shore
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smartship_shore}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:shore}
    password: ${MYSQL_PASS:shore123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

shore:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:smartship-shore}
    # Matches the real Edge publisher convention zncb/{mmsi}/{topicSuffix}.
    topics: zncb/+/+
    qos: 1
    clean-session: false
    auto-reconnect: true
    keep-alive-interval: 60
    connection-timeout: 10
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    connect-retry-delay-ms: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    raw-topic: ship.telemetry.raw
    raw-topic-partitions: 6
    dlt-topic: ship.telemetry.raw.DLT
    # DLT producer bound: delivery.timeout.ms >= request.timeout.ms + linger.ms
    # (5000 >= 4000 + 0); violations fail fast at startup.
    dlt-request-timeout-ms: 4000
    dlt-delivery-timeout-ms: 5000
    dlt-linger-ms: 0
    dlt-max-block-ms: 5000
    group-id: smartship-history
    latest-state-group-id: smartship-latest-state
  redis:
    # TTL refreshed on every effective latest-state update; stale events never touch it.
    latest-state-ttl-seconds: 86400
