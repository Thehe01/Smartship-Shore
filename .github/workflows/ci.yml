name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # GitHub-hosted runners ship Docker, so every Testcontainers E2E
      # (Mosquitto / Kafka / MySQL / Redis) runs for real here — nothing
      # may be skipped or disabled to get green.
      - name: Run full test suite
        run: mvn -B clean test

      - name: Summarize test results
        if: always()
        run: |
          echo "=== Surefire per-class summary ==="
          grep -h "Tests run" target/surefire-reports/*.txt
          echo "=== Totals ==="
          TOTALS=$(grep -h "Tests run" target/surefire-reports/*.txt \
            | awk -F'[:,]' '{r+=$2; f+=$4; e+=$6; s+=$8} END {print r+0, f+0, e+0, s+0}')
          echo "tests run / failures / errors / skipped: $TOTALS"
          set -- $TOTALS
          if [ "$2" != "0" ] || [ "$3" != "0" ]; then
            echo "FAIL: failures or errors detected"
            exit 1
          fi
          echo "=== Docker E2E must have really executed (Skipped must be 0) ==="
          for t in HistoryConsumerTestcontainersTest TrueE2EMqttKafkaMySqlTest \
                   MqttRedeliveryE2ETest HistoryDltTestcontainersTest \
                   LatestStateLuaTestcontainersTest LatestStateKafkaTestcontainersTest; do
            f=$(ls target/surefire-reports/*"$t".txt 2>/dev/null || true)
            if [ -z "$f" ]; then
              echo "FAIL: no surefire report for $t"
              exit 1
            fi
            line=$(grep "Tests run" "$f")
            echo "$t: $line"
            case "$line" in
              *"Skipped: 0"*) ;;
              *) echo "FAIL: $t did not really execute"; exit 1;;
            esac
          done
          echo "All Docker E2E suites executed with 0 failures / 0 errors."

      - name: Package
        run: mvn -B clean package
