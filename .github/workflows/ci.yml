name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # GitHub-hosted runners ship Docker, so every Testcontainers E2E
      # (Mosquitto / Kafka / MySQL / Redis) runs for real here: nothing
      # may be skipped or disabled to get green.
      #
      # Cross-repo E2E (EdgeProtocolE2ETest) compiles against the real Edge
      # classes via a test-scope dependency. The Edge repo is public, so the
      # stock token can check it out; install once into the job-local ~/.m2
      # (reused by the retry loop below through the maven cache).
      - name: Checkout Edge repo
        uses: actions/checkout@v4
        with:
          repository: Thehe01/Smartship
          ref: main
          path: .edge-checkout

      - name: Install Edge artifact (test-scope E2E dependency)
        run: mvn -B -f .edge-checkout/pom.xml install -DskipTests
      # A cold runner cache can hit Maven Central rate limits (HTTP 429) while
      # resolving artifacts. That is transient infra noise, so each Maven
      # invocation retries up to 3 times with growing backoff; every retry
      # reuses the local repository and makes progress. A genuinely failing
      # build or test fails all attempts and stays red: nothing is masked.
      - name: Run full test suite
        run: |
          for attempt in 1 2 3; do
            if mvn -B clean test; then
              break
            fi
            echo "mvn clean test attempt $attempt failed"
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 60))
          done

      - name: Summarize test results
        if: always()
        run: |
          shopt -s nullglob
          files=(target/surefire-reports/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "FAIL: no surefire reports found (compile failure?)"
            exit 1
          fi
          echo "=== Surefire per-class summary ==="
          grep -h "Tests run" "${files[@]}"
          echo "=== Totals ==="
          TOTALS=$(grep -h "Tests run" "${files[@]}" \
            | awk -F'[:,]' '{r+=$2; f+=$4; e+=$6; s+=$8} END {print r+0, f+0, e+0, s+0}')
          echo "tests run / failures / errors / skipped: $TOTALS"
          set -- $TOTALS
          if [ "$2" != "0" ] || [ "$3" != "0" ]; then
            echo "FAIL: failures or errors detected"
            exit 1
          fi
          echo "=== Docker E2E must have really executed (Skipped must be 0) ==="
          for t in HistoryConsumerTestcontainersTest TrueE2EMqttKafkaMySqlTest \
                   MqttRedeliveryE2ETest HistoryDltTestcontainersTest \
                   LatestStateLuaTestcontainersTest LatestStateKafkaTestcontainersTest \
                   EdgeProtocolE2ETest; do
            f=$(ls target/surefire-reports/*"$t".txt 2>/dev/null || true)
            if [ -z "$f" ]; then
              echo "FAIL: no surefire report for $t"
              exit 1
            fi
            line=$(grep "Tests run" "$f")
            echo "$t: $line"
            case "$line" in
              *"Skipped: 0"*) ;;
              *) echo "FAIL: $t did not really execute"; exit 1;;
            esac
          done
          echo "All Docker E2E suites executed with 0 failures / 0 errors."

      # Same transient-429 resilience as the test step above; the local
      # repository is already warm by now, so this normally passes first try.
      - name: Package
        run: |
          for attempt in 1 2 3; do
            if mvn -B clean package; then
              break
            fi
            echo "mvn clean package attempt $attempt failed"
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 60))
          done
