name: benchmark

# Manual benchmark runs only. Never triggered by push/PR and never part of the
# normal CI: deterministic workload against real Docker infrastructure via
# Testcontainers, results uploaded as artifacts. Re-dispatch manually on
# transient infrastructure flakes (e.g. Maven Central 429 on a cold cache).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark scenario: baseline sweep, concurrent producers, or soak'
        required: false
        default: 'baseline'
        type: choice
        options:
          - baseline
          - concurrent
          - soak
      sizes:
        description: 'Baseline sizes, comma-separated (e.g. 1000 or 1000,10000,50000)'
        required: false
        default: '1000'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # The concurrent scenario drains up to 2.5M messages through a
    # single-threaded history consumer; the baseline sweep never needs this
    # much, but one shared cap keeps the workflow simple.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The benchmark Maven profile runs ONLY @Tag("benchmark") tests; the
      # plain suite stays untouched by this job. BENCHMARK_MODE selects exactly
      # one scenario inside the profile (the others abort via assumption).
      - name: Run baseline benchmark
        if: ${{ inputs.mode == 'baseline' }}
        run: BENCHMARK_SIZES='${{ inputs.sizes }}' mvn -B -Pbenchmark test

      - name: Run concurrent-producer benchmark
        if: ${{ inputs.mode == 'concurrent' }}
        run: >
          BENCHMARK_MODE=concurrent
          PRODUCER_COUNTS=1,10,50
          MESSAGES_PER_PRODUCER=50000
          mvn -B -Pbenchmark test

      - name: Run sustained-pressure soak benchmark
        if: ${{ inputs.mode == 'soak' }}
        run: >
          BENCHMARK_MODE=soak
          SOAK_SHIPS=50
          SOAK_POINTS_PER_SEC=50
          SOAK_STEADY_PER_PRODUCER=9000
          SOAK_OUTAGE_PER_PRODUCER=15000
          mvn -B -Pbenchmark test

      - name: Publish results to job summary
        if: always()
        run: |
          found=0
          if [ -f target/benchmark-results/benchmark-results.md ]; then
            cat target/benchmark-results/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
            found=1
          fi
          if [ -f target/benchmark-results/concurrent-producer-results.md ]; then
            cat target/benchmark-results/concurrent-producer-results.md >> "$GITHUB_STEP_SUMMARY"
            found=1
          fi
          if [ -f target/benchmark-results/soak-results.md ]; then
            cat target/benchmark-results/soak-results.md >> "$GITHUB_STEP_SUMMARY"
            found=1
          fi
          if [ "$found" = 0 ]; then
            echo "FAIL: no benchmark results produced"
            exit 1
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/benchmark-results/
          if-no-files-found: error
